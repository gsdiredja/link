<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --card-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    }

    .name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .link-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      background-color: var(--card);
      color: var(--text);
      text-decoration: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid var(--card-border);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-btn:hover {
      background-color: var(--card-hover);
      border-color: #60a5fa;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
    }

    .status-msg {
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 24px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Profil Avatar -->
    <div class="avatar">🔗</div>
    <h1 class="name">Portal Tautan</h1>
    <p class="bio">Akses cepat layanan & aktivitas</p>

    <!-- Kontainer Link Dinamis -->
    <div class="link-list" id="link-container">
      <p class="status-msg">Memuat tautan...</p>
    </div>
  </div>

  <script>
    const SHEET_ID = '1Z2GvGZ5H96jnwQHE-wuJfMsUc9xP4cwqZ7muFjqv9qI';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    async function fetchLinks() {
      const container = document.getElementById('link-container');
      
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('Gagal mengakses data');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        container.innerHTML = '';

        let totalLinks = 0;

        // Abaikan baris 0 (header kolom)
        for (let i = 1; i < rows.length; i++) {
          const [title, rawUrl, active] = rows[i];

          // Validasi jika kolom aktif bernilai FALSE
          const isActive = !active || active.trim().toUpperCase() !== 'FALSE';

          if (title && rawUrl && isActive) {
            let url = rawUrl.trim();
            
            // Otomatis memperbaiki jika format URL kurang satu slash (seperti https:/example.com)
            if (url.startsWith('https:/') && !url.startsWith('https://')) {
              url = url.replace('https:/', 'https://');
            } else if (url.startsWith('http:/') && !url.startsWith('http://')) {
              url = url.replace('http:/', 'http://');
            }

            const btn = document.createElement('a');
            btn.className = 'link-btn';
            btn.href = url;
            btn.textContent = title.trim();
            btn.target = '_blank';
            btn.rel = 'noopener noreferrer';
            
            container.appendChild(btn);
            totalLinks++;
          }
        }

        if (totalLinks === 0) {
          container.innerHTML = '<p class="status-msg">Belum ada tautan aktif yang tersedia.</p>';
        }

      } catch (err) {
        container.innerHTML = '<p class="status-msg">Gagal memuat link. Pastikan akses spreadsheet bersifat "Anyone with the link can view".</p>';
      }
    }

    function parseCSV(text) {
      return text.trim().split(/\r?\n/).map(row => {
        const regex = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*|(?:\n|$))/g;
        let matches = [];
        let match;
        while ((match = regex.exec(row)) !== null) {
          let val = match[1];
          if (val && val.startsWith('"') && val.endsWith('"')) {
            val = val.slice(1, -1).replace(/""/g, '"');
          }
          matches.push(val ?? '');
          if (regex.lastIndex === row.length) break;
        }
        return matches.slice(0, 3);
      });
    }

    fetchLinks();
  </script>
</body>
</html>
